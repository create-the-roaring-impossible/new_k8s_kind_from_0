---
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
# Cluster purpose: Local development environment with registry integration
networking:
  # WARNING: It is _strongly_ recommended that you keep this the default (127.0.0.1) for security reasons. However it is possible to change this.
  apiServerAddress: "127.0.0.1"
  # By default the API server listens on a random open port. You may choose a specific port but probably don't need to in most cases.
  # Using a random port makes it easier to spin up multiple clusters.
  apiServerPort: 10443
  # The default CNI will not be installed
  disableDefaultCNI: true
  # TODO: to install Calico CNI, via Helm
  # To install Calico CNI after cluster creation, follow the official guide: https://docs.projectcalico.org/getting-started/kubernetes/kind/
  # See https://projectcalico.docs.tigera.io/getting-started/kubernetes/kind/ for installation instructions.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
    endpoint = ["http://local-registry:5000"]
featureGates:
  # Enable specific Kubernetes features if needed
  EphemeralContainers: true
nodes:
- role: control-plane
  name: control-plane-1
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
        node-labels: "role=control-plane,ingress-ready=true,node=control-plane-1"
#         register-with-taints: "my-taint=presence:NoSchedule" 
  # Add resource limits for more predictable performance
  extraMounts:
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
  name: worker-1
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
        node-labels: "role=worker,ingress-ready=true,node=worker-1"
#         register-with-taints: "my-taint=presence:NoSchedule"
  # Add resource limits for more predictable performance
  extraMounts:
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
- role: worker
  name: worker-2
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
        node-labels: "role=worker,ingress-ready=true,node=worker-1"
#         register-with-taints: "my-taint=presence:NoSchedule"
  # Add resource limits for more predictable performance
  extraMounts:
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"