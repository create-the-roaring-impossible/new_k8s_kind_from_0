name: 'Terraform State Import'
description: 'Terraform State Import'
inputs:
  kubeconfig:
    description: 'Kubernetes config content'
    required: true
  gitlab_user:
    description: 'GitLab user'
    required: true
  gitlab_token:
    description: 'GitLab token'
    required: true
  gitlab_project_id:
    description: 'GitLab project ID'
    required: true
  tool:
    description: 'Tool'
    required: true
  env:
    description: 'Environment'
    required: true
  scope:
    description: 'Scope'
    required: true
  logLevel:
    description: 'Log Level'
    default: 'ERROR'
    required: false
  address:
    description: 'Address'
    required: true
  id:
    description: 'ID'
    required: true
runs:
  using: 'composite'
  steps:
    - name: 'Terraform Utils'
      uses: ./.github/actions/tf-utils-composite-action
      with:
        kubeconfig: ${{ inputs.kubeconfig }}
    - name: STATE IMPORT - Run terraform.sh script
      shell: bash
      run: |
        bash scripts/bash/terraform.sh -TOOL '${{ inputs.tool }}' \
                                       -TF_PATH 'terraform/${{ inputs.scope }}' \
                                       -ENV '${{ inputs.env }}' \
                                       -SCOPE '${{ inputs.scope }}' \
                                       -ACTION 'import' \
                                       -LOG_LEVEL '${{ inputs.logLevel }}' \
                                       -ADDRESS '${{ inputs.address }}' \
                                       -ID '${{ inputs.id }}' \
                                       -GITLAB_USER ${{ inputs.gitlab_user }} \
                                       -GITLAB_TOKEN ${{ inputs.gitlab_token }} \
                                       -GITLAB_PROJECT_ID ${{ inputs.gitlab_project_id }}