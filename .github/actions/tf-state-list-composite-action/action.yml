name: 'Terraform State List'
description: 'Terraform State List'
inputs:
  kubeconfig:
    description: 'Kubernetes config content'
    required: true
  gitlab_user:
    description: 'GitLab user'
    required: true
  gitlab_token:
    description: 'GitLab token'
    required: true
  gitlab_project_id:
    description: 'GitLab project ID'
    required: true
  scope:
    description: 'Scope'
    required: true
  env:
    description: 'Environment'
    required: true
  logLevel:
    description: 'Log Level'
    default: 'ERROR'
    required: false
runs:
  using: 'composite'
  steps:
    - name: 'Terraform Utils'
      uses: ./.github/actions/tf-utils-composite-action
      with:
        kubeconfig: ${{ inputs.kubeconfig }}
    - name: STATE LIST - Run terraform.sh script
      shell: bash
      run: |
        bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ inputs.scope }}' \
                                        -ENV '${{ inputs.env }}' \
                                        -SCOPE '${{ inputs.scope }}' \
                                        -ACTION 'state list' \
                                        -LOG_LEVEL '${{ inputs.logLevel }}' \
                                        -GITLAB_USER ${{ inputs.gitlab_user }} \
                                        -GITLAB_TOKEN ${{ inputs.gitlab_token }} \
                                        -GITLAB_PROJECT_ID ${{ inputs.gitlab_project_id }}