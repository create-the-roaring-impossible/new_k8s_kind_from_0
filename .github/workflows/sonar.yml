name: 'SonarQube Scan'
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarQubeScan:
    name: SonarQube
    runs-on: 'docker' # TODO: to use the new pool
    container:
      image: sennar19/sonar_cli:latest
      credentials:
        username: ${{ secrets.DOCKER_HUB_SENNAR19_USER }}
        password: ${{ secrets.DOCKER_HUB_SENNAR19_TOKEN }}
      options: --user root
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}