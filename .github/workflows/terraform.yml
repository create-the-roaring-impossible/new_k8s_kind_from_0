name: 'Terraform CI\CD'
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Set the environment'
        type: choice
        required: true
        default: 'local'
        options:
          - 'local'
      scope:
        description: 'Set the scope'
        type: choice
        required: true
        default: 'desktop-s8glse7'
        options:
          - 'desktop-s8glse7'
      action:
        description: 'Set the action to do'
        type: choice
        required: true
        default: 'plan'
        options:
          - 'nothing (only for test purposes)'
          - 'plan'
          - 'apply'
          - 'import'
          - 'remove'
          - 'move'
          - 'list'
      logLevel:
        description: 'Set the log level (optional)'
        type: choice
        required: false
        default: 'ERROR'
        options:
          - 'NONE'
          - 'INFO'
          - 'WARN'
          - 'ERROR'
          - 'DEBUG'
          - 'TRACE'
      targets:
        description: 'Set the targets (optional) [only if you use "plan" action]'
        type: string
        required: false
        default: ''
      # isRC:
      #   description: 'Is this a Release Candidate?'
      #   type: boolean
      #   required: true
      #   default: true
jobs:
  terraform:
    name: Terraform
    runs-on: 'arc-desktop-s8glse7'
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Terraform
        run: |
          pwsh scripts/pwsh/terraform.ps1 'terraform/${{ github.event.inputs.scope }}' \
                                          '${{ github.event.inputs.env }}' \
                                          '${{ github.event.inputs.scope }}' \
                                          '${{ github.event.inputs.action }}' \
                                          '${{ github.event.inputs.logLevel }}' \
                                          '${{ github.event.inputs.targets }}'