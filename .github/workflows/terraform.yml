name: 'Terraform CI\CD'
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Set the environment'
        type: choice
        required: true
        default: 'local'
        options:
          - 'local'
      scope:
        description: 'Set the scope'
        type: choice
        required: true
        default: 'desktop-s8glse7'
        options:
          - 'desktop-s8glse7'
      action:
        description: 'Set the action to do'
        type: choice
        required: true
        default: 'plan+apply'
        options:
          - 'plan+apply'
          - 'state list'
          - 'state move'
          - 'state remove'
          - 'import'
          - 'nothing (only for test purposes)'
      logLevel:
        description: 'Set the log level (optional)'
        type: choice
        required: false
        default: 'ERROR'
        options:
          - 'NONE'
          - 'INFO'
          - 'WARN'
          - 'ERROR'
          - 'DEBUG'
          - 'TRACE'
      targets:
        description: 'Set the targets (optional, comma-separated) [only for "plan+apply" action]. Example: -target=aws_instance.web,-target=aws_s3_bucket.data'
        type: string
        required: false
        default: ''
      source:
        description: 'Set the source (optional) [only for "move" action]. Example: aws_instance.web'
        type: string
        required: false
        default: ''
      destination:
        description: 'Set the destination (optional) [only for "move" action]. Example: aws_instance.web_new'
        type: string
        required: false
        default: ''
      address:
        description: 'Set the address (optional) [only for "remove" and "import" actions]. Example: aws_instance.web'
        type: string
        required: false
        default: ''
      id:
        description: 'Set the ID (optional) [only for "import" action]. Example: i-1234567890abcdef0'
        type: string
        required: false
        default: ''
      # isRC:
      #   description: 'Is this a Release Candidate?'
      #   type: boolean
      #   required: true
      #   default: true
env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: true
  TF_IN_AUTOMATION: 'true'
jobs:
  terraformPlan:
    name: 'Terraform Plan'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'plan+apply' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tf-utils-composite-action
      - name: PLAN - Run terraform.sh script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ github.event.inputs.scope }}' \
                                         -ENV '${{ github.event.inputs.env }}' \
                                         -SCOPE '${{ github.event.inputs.scope }}' \
                                         -ACTION 'plan' \
                                         -LOG_LEVEL '${{ github.event.inputs.logLevel }}' \
                                         -TARGETS '${{ github.event.inputs.targets }}' \
                                         -GITLAB_USER $GL_USER \
                                         -GITLAB_TOKEN $GL_TOKEN
      - name: Publish plan.output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'planOutput'
          path: '${{ github.workspace }}/terraform/${{ github.event.inputs.scope }}/${{ github.event.inputs.env }}/plan.output'
          if-no-files-found: error
          retention-days: 0 # 0 means using repository retention settings
          compression-level: 6
          overwrite: true
          include-hidden-files: false
  # TODO: to add 'plan scan', via Chekov or tfsec or other tools
  ManualTerraformPlanApproval:
    name: 'ManualTerraformPlanApproval'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'plan+apply' && needs.terraformPlan.result == 'success' }}
    needs: terraformPlan
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      # TODO: to check section 'Org team approver', to 'https://github.com/marketplace/actions/manual-workflow-approval' url
      # - name: Generate token
      #   id: generate_token
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ secrets.APP_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: Sennar19 # TODO: to set 'Admin'
          minimum-approvals: 1
          issue-title: "Terraform Plan - Manual Approval Required"
          issue-body: "Validate Terraform plan"
          exclude-workflow-initiator-as-approver: false
          fail-on-denial: true
          additional-approved-words: ''
          additional-denied-words: ''
  terraformApply:
    name: 'Terraform Apply'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'plan+apply' && needs.ManualTerraformPlanApproval.result == 'success' }}
    needs: ManualTerraformPlanApproval
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tf-utils-composite-action
      - name: Download plan.output Artifact
        uses: actions/download-artifact@v5
        with:
          name: 'planOutput'
          path: '${{ github.workspace }}/terraform/${{ github.event.inputs.scope }}/${{ github.event.inputs.env }}/'
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: APPLY - Run terraform.sh script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ github.event.inputs.scope }}' \
                                         -ENV '${{ github.event.inputs.env }}' \
                                         -SCOPE '${{ github.event.inputs.scope }}' \
                                         -ACTION 'apply' \
                                         -LOG_LEVEL '${{ github.event.inputs.logLevel }}' \
                                         -GITLAB_USER $GL_USER \
                                         -GITLAB_TOKEN $GL_TOKEN
  terraformStateList:
    name: 'Terraform State List'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'state list' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tf-utils-composite-action
      - name: STATE LIST - Run terraform.sh script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ github.event.inputs.scope }}' \
                                         -ENV '${{ github.event.inputs.env }}' \
                                         -SCOPE '${{ github.event.inputs.scope }}' \
                                         -ACTION 'state list' \
                                         -LOG_LEVEL '${{ github.event.inputs.logLevel }}' \
                                         -GITLAB_USER $GL_USER \
                                         -GITLAB_TOKEN $GL_TOKEN
  terraformStateMove:
    name: 'Terraform State Move'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'state move' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tf-utils-composite-action
      - name: STATE MOVE - Run terraform.sh script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ github.event.inputs.scope }}' \
                                         -ENV '${{ github.event.inputs.env }}' \
                                         -SCOPE '${{ github.event.inputs.scope }}' \
                                         -ACTION 'state move' \
                                         -LOG_LEVEL '${{ github.event.inputs.logLevel }}' \
                                         -SOURCE '${{ github.event.inputs.source }}' \
                                         -DESTINATION '${{ github.event.inputs.destination }}' \
                                         -GITLAB_USER $GL_USER \
                                         -GITLAB_TOKEN $GL_TOKEN
  terraformStateRemove:
    name: 'Terraform State Remove'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'state remove' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tf-utils-composite-action
      - name: STATE REMOVE - Run terraform.sh script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ github.event.inputs.scope }}' \
                                         -ENV '${{ github.event.inputs.env }}' \
                                         -SCOPE '${{ github.event.inputs.scope }}' \
                                         -ACTION 'state remove' \
                                         -LOG_LEVEL '${{ github.event.inputs.logLevel }}' \
                                         -ADDRESS '${{ github.event.inputs.address }}' \
                                         -GITLAB_USER $GL_USER \
                                         -GITLAB_TOKEN $GL_TOKEN
  terraformStateImport:
    name: 'Terraform State Import'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'import' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tf-utils-composite-action
      - name: STATE IMPORT - Run terraform.sh script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh -TF_PATH 'terraform/${{ github.event.inputs.scope }}' \
                                         -ENV '${{ github.event.inputs.env }}' \
                                         -SCOPE '${{ github.event.inputs.scope }}' \
                                         -ACTION 'import' \
                                         -LOG_LEVEL '${{ github.event.inputs.logLevel }}' \
                                         -ADDRESS '${{ github.event.inputs.address }}' \
                                         -ID '${{ github.event.inputs.id }}' \
                                         -GITLAB_USER $GL_USER \
                                         -GITLAB_TOKEN $GL_TOKEN