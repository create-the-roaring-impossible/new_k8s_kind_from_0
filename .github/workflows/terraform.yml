# TODO: to define from a template
name: 'Terraform CI\CD'
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Set the environment'
        type: choice
        required: true
        default: 'local'
        options:
          - 'local'
      scope:
        description: 'Set the scope'
        type: choice
        required: true
        default: 'desktop-s8glse7'
        options:
          - 'desktop-s8glse7'
      action:
        description: 'Set the action to do'
        type: choice
        required: true
        default: 'plan+apply'
        options:
          - 'nothing (only for test purposes)'
          - 'plan+apply'
          - 'state list'
          - 'state move'
          - 'import'
          - 'state remove'
      logLevel:
        description: 'Set the log level (optional)'
        type: choice
        required: false
        default: 'ERROR'
        options:
          - 'NONE'
          - 'INFO'
          - 'WARN'
          - 'ERROR'
          - 'DEBUG'
          - 'TRACE'
      targets:
        description: 'Set the targets (optional, comma-separated) [only for "plan+apply" action]. Example: -target=aws_instance.web,-target=aws_s3_bucket.data'
        type: string
        required: false
        default: ''
      address:
        description: 'Set the address (optional) [only for "import", "remove" and "move" actions]. Example: aws_instance.web'
        type: string
        required: false
        default: ''
      id:
        description: 'Set the ID (optional) [only for "import" action]. Example: i-1234567890abcdef0'
        type: string
        required: false
        default: ''
      source:
        description: 'Set the source (optional) [only for "move" action]. Example: aws_instance.web'
        type: string
        required: false
        default: ''
      destination:
        description: 'Set the destination (optional) [only for "move" action]. Example: aws_instance.web_new'
        type: string
        required: false
        default: ''
      # isRC:
      #   description: 'Is this a Release Candidate?'
      #   type: boolean
      #   required: true
      #   default: true
env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: true
  TF_IN_AUTOMATION: 'true'
jobs:
  terraformPlan:
    name: 'Terraform Plan'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'plan+apply' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create Terraform Plugin Cache Dir
        run: mkdir --parents $TF_PLUGIN_CACHE_DIR
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key:  ${{ runner.os }}${{ runner.arch }}-terraform
          restore-keys: |
            ${{ runner.os }}${{ runner.arch }}-terraform
      - name: PLAN - Run terraform.ps1 script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          bash scripts/bash/terraform.sh 'terraform/${{ github.event.inputs.scope }}' \
                                         '${{ github.event.inputs.env }}' \
                                         '${{ github.event.inputs.scope }}' \
                                         'plan' \
                                         '${{ github.event.inputs.logLevel }}' \
                                         '${{ github.event.inputs.targets }}' \
                                         '${{ github.event.inputs.address }}' \
                                         '${{ github.event.inputs.id }}' \
                                         '${{ github.event.inputs.source }}' \
                                         '${{ github.event.inputs.destination }}' \
                                         $GL_USER \
                                         $GL_TOKEN
      - name: Publish plan.output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'planOutput'
          path: '${{ github.workspace }}/terraform/${{ github.event.inputs.scope }}/${{ github.event.inputs.env }}/plan.output'
          if-no-files-found: error
          retention-days: 0 # 0 means using repository retention settings
          compression-level: 6
          overwrite: true
          include-hidden-files: false
  # TODO: to add 'plan scan', via Chekov or tfsec or other tools
  ManualTerraformPlanApproval:
    name: 'ManualTerraformPlanApproval'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'plan+apply' }} && success('terraformPlan')
    needs: terraformPlan
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      # TODO: to check section 'Org team approver', to 'https://github.com/marketplace/actions/manual-workflow-approval' url
      # - name: Generate token
      #   id: generate_token
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ secrets.APP_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: Sennar19 # TODO: to set 'Admin'
          minimum-approvals: 1
          issue-title: "Terraform Plan - Manual Approval Required"
          issue-body: "Validate Terraform plan"
          exclude-workflow-initiator-as-approver: false
          fail-on-denial: true
          additional-approved-words: ''
          additional-denied-words: ''
  terraformApply:
    name: 'Terraform Apply'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'plan+apply' }} && success('ManualTerraformPlanApproval')
    needs: ManualTerraformPlanApproval
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create Terraform Plugin Cache Dir
        run: mkdir --parents $TF_PLUGIN_CACHE_DIR
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key:  ${{ runner.os }}${{ runner.arch }}-terraform
          restore-keys: |
            ${{ runner.os }}${{ runner.arch }}-terraform
      - name: Download plan.output Artifact
        uses: actions/download-artifact@v5
        with:
          name: 'planOutput'
          path: '${{ github.workspace }}/terraform/${{ github.event.inputs.scope }}/${{ github.event.inputs.env }}/'
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: APPLY - Run terraform.ps1 script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          pwsh scripts/pwsh/terraform.ps1 -Path 'terraform/${{ github.event.inputs.scope }}' \
                                          -Env '${{ github.event.inputs.env }}' \
                                          -Scope '${{ github.event.inputs.scope }}' \
                                          -Action 'apply' \
                                          -LogLevel '${{ github.event.inputs.logLevel }}' \
                                          -Targets '${{ github.event.inputs.targets }}' \
                                          -Address '${{ github.event.inputs.address }}' \
                                          -Id '${{ github.event.inputs.id }}' \
                                          -Source '${{ github.event.inputs.source }}' \
                                          -Destination '${{ github.event.inputs.destination }}' \
                                          -GitLabUser $GL_USER \
                                          -GitLabToken $GL_TOKEN
  terraformStateList:
    name: 'Terraform State List'
    runs-on: 'arc-desktop-s8glse7'
    if: ${{ github.event.inputs.action == 'state list' }}
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create Terraform Plugin Cache Dir
        run: mkdir --parents $TF_PLUGIN_CACHE_DIR
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key:  ${{ runner.os }}${{ runner.arch }}-terraform
          restore-keys: |
            ${{ runner.os }}${{ runner.arch }}-terraform
      - name: STATE LIST - Run terraform.ps1 script
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          pwsh scripts/pwsh/terraform.ps1 -Path 'terraform/${{ github.event.inputs.scope }}' \
                                          -Env '${{ github.event.inputs.env }}' \
                                          -Scope '${{ github.event.inputs.scope }}' \
                                          -Action 'state list' \
                                          -LogLevel '${{ github.event.inputs.logLevel }}' \
                                          -Targets '${{ github.event.inputs.targets }}' \
                                          -Address '${{ github.event.inputs.address }}' \
                                          -Id '${{ github.event.inputs.id }}' \
                                          -Source '${{ github.event.inputs.source }}' \
                                          -Destination '${{ github.event.inputs.destination }}' \
                                          -GitLabUser $GL_USER \
                                          -GitLabToken $GL_TOKEN
