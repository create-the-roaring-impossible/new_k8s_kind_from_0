name: 'Terraform CI\CD'
on:
  workflow_dispatch:
jobs:
  terraform:
    name: Terraform
    runs-on: 'arc-desktop-s8glse7'
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:1.2.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Terraform Init
        run: |
          terraform --version
          ls -larth