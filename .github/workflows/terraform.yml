name: 'Terraform CI\CD'
on:
  workflow_dispatch:
jobs:
  terraform:
    name: Terraform
    runs-on: 'arc-desktop-s8glse7'
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
      options: --user root
    steps:
      - name: TEST
        run: |
          ls -larth /__w/
          ls -larth /__w/_temp/
          ls -larth /__w/_temp/_runner_file_commands/
          sudo chmod 777 /__w/_temp/_runner_file_commands/
          sudo chown root:root /__w/_temp/_runner_file_commands/
          ls -larth /__w/
          ls -larth /__w/_temp/
          ls -larth /__w/_temp/_runner_file_commands/
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Terraform Init
        run: |
          terraform --version