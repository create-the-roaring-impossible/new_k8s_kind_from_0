name: 'Docker - Build And Push'
on:
  workflow_dispatch:
    inputs:
      docker_repository:
        description: 'Set the Docker Repository to use'
        type: choice
        required: true
        default: 'ghcr.io/create-the-roaring-impossible/tf'
        options:
          - 'ghcr.io/create-the-roaring-impossible/tf'
      dockerfile:
        description: 'Set the Dockerfile to use'
        type: choice
        required: true
        default: './dockerfiles/tf.dockerfile'
        options:
          - './dockerfiles/tf.dockerfile'
      tag:
        description: 'Set the tag to build'
        type: string
        required: true
        default: '1.0.0'
      isRC:
        description: 'Is this a Release Candidate?'
        type: boolean
        required: true
        default: true
jobs:
  buildAndPush:
    name: 'Docker - Build And Push'
    runs-on: 'docker'
    outputs:
      RC_Version: ${{ steps.set-rc-version.outputs.RCVersion }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.docker_repository }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set variable 'RCVersion', based on input 'isRC'
        id: set-rc-version
        shell: bash
        run: |
          if [ "${{ github.event.inputs.isRC }}" = "true" ]; then
            RCVersion="-${{ github.run_number }}"
          else
            RCVersion=""
          fi
          echo "RCVersion=$RCVersion" >> $GITHUB_ENV
          echo "RCVersion=$RCVersion" >> $GITHUB_OUTPUT
      - name: Set build date
        id: set-build-date
        shell: bash
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      - name: Set author mail
        id: set-author-mail
        shell: bash
        run: |
          echo "email=$(git show -s --format='%ae' "${GITHUB_SHA}")" >> $GITHUB_ENV
          echo "email=$(git show -s --format='%ae' "${GITHUB_SHA}")" >> $GITHUB_OUTPUT
      - name: 'Build and Push Docker Image, tag "${{ github.event.inputs.tag }}${{ env.RCVersion }}"'
        uses: docker/build-push-action@v6
        with:
          context: '.'
          file: ${{ github.event.inputs.dockerfile }}
          push: true
          tags: ${{ github.event.inputs.docker_repository }}:${{ github.event.inputs.tag }}${{ env.RCVersion }}
          provenance: false
          labels: |
            org.opencontainers.image.title=${{ github.event.inputs.docker_repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.inputs.tag }}${{ env.RCVersion }}
            org.opencontainers.image.created=${{ steps.set-build-date.outputs.date }}
            org.opencontainers.image.authors=${{ steps.set-author-mail.outputs.email }}
            org.opencontainers.image.licenses=gpl-3.0
      - name: 'Build and Push Docker Image, tag "latest"'
        if: ${{ github.event.inputs.isRC == 'false' }}
        uses: docker/build-push-action@v6
        with:
          context: '.'
          file: ${{ github.event.inputs.dockerfile }}
          push: true
          tags: ${{ github.event.inputs.docker_repository }}:latest
          provenance: false
          labels: |
            org.opencontainers.image.title=${{ github.event.inputs.docker_repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=latest
            org.opencontainers.image.created=${{ steps.set-build-date.outputs.date }}
            org.opencontainers.image.authors=${{ steps.set-author-mail.outputs.email }}
            org.opencontainers.image.licenses=gpl-3.0
  cleanup:
    name: 'Cleanup'
    needs: [buildAndPush]
    if: success()
    runs-on: 'docker'
    env:
      RCVersion: ${{ needs.buildAndPush.outputs.RC_Version }}
    steps:
      - name: 'Cleanup tags "${{ github.event.inputs.tag }}${{ env.RCVersion }}", and "latest", of Docker image ${{ github.event.inputs.docker_repository }}'
        run: |
          chmod +x ./scripts/bash/docker_clean.sh
          ./scripts/bash/docker_clean.sh ${{ github.event.inputs.docker_repository }} ${{ github.event.inputs.tag }}${{ env.RCVersion }}
        shell: bash