name: 'Terraform Docs & Scan'
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  terraformDocsAndScan:
    name: 'Terraform Docs And Scan'
    runs-on: 'arc-desktop-s8glse7'
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Copy 'backend.tf' and 'variables.tf' files in all environment folders
        shell: bash
        run: |
          for dir in $(find terraform/ -maxdepth 1 -mindepth 1 -type d);
            do
              for subdir in $(find $dir -maxdepth 1 -mindepth 1 -type d);
                do
                  if ("$subdir" == "docs"); then
                    continue; 
                  else
                    cp ${dir}/backend.tf ${dir}/${subdir}/backend.tf
                    cp ${dir}/variables.tf ${dir}/${subdir}/variables.tf
                  fi
                done
            done
      - name: Render terraform docs inside the README.md and push changes back to PR branch
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/desktop-s8glse7/local
          # find-dir: terraform/ # terraform/desktop-s8glse7/
          # atlantis-file: atlantis.yaml
          config-file: '../docs/.terraform-docs.yml'
          # git-commit-message: 'Update documentation and scan reports - ASDASDASD' # TODO: to set something like 'https://dev.azure.com/fierli92/personal-project/_build/results?buildId=$(Build.BuildId)&view=results'
          git-push: 'false' # 'true'
          # git-push-user-email: 'github@fake-domain.lol'
          # git-push-user-name: 'GitHub Bot'
      - name: Delete 'backend.tf' and 'variables.tf' files in all environment folders
        shell: bash
        run: |
          for dir in $(find terraform/ -maxdepth 1 -mindepth 1 -type d);
            do
              for subdir in $(find $dir -maxdepth 1 -mindepth 1 -type d);
                do
                  if ("$subdir" == "docs"); then
                    continue; 
                  else
                    ls -larth
                    rm -rf ${subdir}/backend.tf
                    rm -rf ${subdir}/variables.tf
                  fi
                done
            done