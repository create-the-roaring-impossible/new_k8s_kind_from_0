name: 'Terraform Docs & Scan'
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  terraformDocsAndScan:
    name: 'Terraform Docs And Scan'
    runs-on: 'arc-desktop-s8glse7'
    container:
      image: ghcr.io/create-the-roaring-impossible/tf:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Copy 'backend.tf' and 'variables.tf' files in all environment folders
        shell: bash
        run: |
          for dir in $(find terraform/ -maxdepth 1 -mindepth 1 -type d); # TODO: to pass "terraform/" as argument
            do
              echo $dir
              for subdir in $(find $dir -maxdepth 1 -mindepth 1 -type d);
                do
                  if [[ "$(basename $subdir)" == "docs" ]]; then
                    echo "$subdir is docs folder, skipping..."
                    continue; 
                  else
                    echo $subdir
                    cd $subdir
                    ls -larth
                    echo "------------------------------------------------------------------------------------------------------------------------------------------------------"
                    cp ../../${dir}/backend.tf backend.tf
                    cp ../../${dir}/variables.tf variables.tf
                    ls -larth
                    cd ..
                    echo "------------------------------------------------------------------------------------------------------------------------------------------------------"
                  fi
                done
            done
      - name: Render terraform docs inside the README.md and push changes back to PR branch
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/desktop-s8glse7/local
          # find-dir: terraform/ # terraform/desktop-s8glse7/
          # atlantis-file: atlantis.yaml
          config-file: '../docs/.terraform-docs.yml'
          git-commit-message: 'Update documentation and scan reports - https://github.com/create-the-roaring-impossible/new_k8s_kind_from_0/actions/runs/21040122145'
          git-push: 'false' # 'true'
          git-push-user-email: 'github@fake-domain.lol'
          git-push-user-name: 'GitHub Bot'
      - name: Delete 'backend.tf' and 'variables.tf' files in all environment folders
        shell: bash
        run: |
          for dir in $(find terraform/ -maxdepth 1 -mindepth 1 -type d); # TODO: to pass "terraform/" as argument
            do
              for subdir in $(find $dir -maxdepth 1 -mindepth 1 -type d);
                do
                  if [[ "$(basename $subdir)" == "docs" ]]; then
                    continue; 
                  else
                    cd $subdir
                    rm -rf backend.tf
                    rm -rf variables.tf
                  fi
                done
            done